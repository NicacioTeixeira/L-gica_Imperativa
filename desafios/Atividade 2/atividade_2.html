<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Exercício 2</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 20px auto; line-height: 1.6; }
        .resultado { margin-top: 20px; padding: 10px; background: #f4f4f4; border-left: 5px solid #333; display: none; }
        .contador { font-weight: bold; color: #555; }
    </style>
</head>

<body>

    <h2>Cadastro de Pessoas (<span id="contagem">0</span>/15)</h2>
    
    <div id="interface-cadastro">
        <label for="nome">Nome:</label><br>
        <input type="text" id="nome"><br><br>

        <label>Gênero:</label><br>
        <input type="radio" name="genero" value="1" id="m"> <label for="m">Masculino</label>
        <input type="radio" name="genero" value="2" id="f"> <label for="f">Feminino</label><br><br>

        <label for="altura">Altura (ex: 1.75):</label><br>
        <input type="number" id="altura" step="0.01"><br><br>

        <button onclick="adicionarPessoa()">Adicionar Dados</button>
    </div>

    <div id="resultado" class="resultado">
        <h3>Resultados:</h3>
        <p id="res-max"></p>
        <p id="res-min"></p>
        <p id="res-media"></p>
        <p id="res-mulheres"></p>
        <button onclick="window.location.reload()">Reiniciar</button>
    </div>

    <script>
        let alturas = [];
        let generos = [];
        const LIMITE = 15;

        function adicionarPessoa() {
            const campoAltura = document.getElementById('altura');
            const campoGenero = document.querySelector('input[name="genero"]:checked');
            
            if (!campoAltura.value || !campoGenero) {
                alert("Preencha todos os campos!");
                return;
            }

            // Captura de dados
            alturas.push(parseFloat(campoAltura.value));
            generos.push(campoGenero.value);

            // Atualiza contador na tela
            document.getElementById('contagem').innerText = alturas.length;

            // Limpa campos para a próxima entrada
            campoAltura.value = '';
            document.getElementById('nome').value = '';

            // Verifica se atingiu o limite para processar
            if (alturas.length >= LIMITE) {
                processarResultados();
            }
        }

        function processarResultados() {
            document.getElementById('interface-cadastro').style.display = 'none';
            const divRes = document.getElementById('resultado');
            divRes.style.display = 'block';

            // Cálculos (Lógica equivalente ao seu script Python)
            const max = Math.max(...alturas);
            const min = Math.min(...alturas);
            const media = alturas.reduce((a, b) => a + b, 0) / alturas.length;
            const mulheres = generos.filter(g => g === "2").length;

            // Exibição
            document.getElementById('res-max').innerText = `Altura Máxima: ${max.toFixed(2)}m`;
            document.getElementById('res-min').innerText = `Altura Mínima: ${min.toFixed(2)}m`;
            document.getElementById('res-media').innerText = `Média de Altura: ${media.toFixed(2)}m`;
            document.getElementById('res-mulheres').innerText = `Total de Mulheres: ${mulheres}`;
        }
    </script>
</body>
</html>
